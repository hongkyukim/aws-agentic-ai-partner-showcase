name: workshop-ci

on:
  push:
  pull_request:

jobs:
  local-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest==8.4.2'
      - run: python3 scripts/generate_sample_data.py
      - run: python3 scripts/run_demo.py
      - run: python3 scripts/evaluate_agents.py
      - run: python3 -m pytest -q
